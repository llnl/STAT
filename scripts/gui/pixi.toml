# Desktop dependencies only; native STAT builds use their separate environment.
[workspace]
name = "stat-gui"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = "3.11.*"
gtk3 = ">=3.24,<4"
pygobject = ">=3.48,<4"
pycairo = ">=1.25,<2"
graphviz = "*"
numpy = "*"
packaging = "*"
pygments = "*"
pip = "*"

[pypi-dependencies]
xdot = ">=1.3,<2"
