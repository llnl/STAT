# Standalone client package; the native STAT build remains managed by Autotools.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stat-gui"
version = "4.3.0"
description = "Standalone STAT GUI and Call graph viewer"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = ["xdot>=1.3,<2", "Pygments>=2.10"]

[project.scripts]
stat-gui = "stat_gui.entry:main"
stat-view = "stat_gui.entry:view_main"
stat-gui-remote-cli = "remote.stat_client_cli:main"

[project.urls]
Homepage = "https://github.com/LLNL/STAT"
Repository = "https://github.com/LLNL/STAT"

[tool.setuptools]
include-package-data = false
packages = ["stat_gui"]
# Shared legacy modules are copied by the build hook from scripts/.
py-modules = ["stat_build_info"]
