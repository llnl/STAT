name: STAT CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: STAT (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # Test the PR head itself, rather than a pinned upstream STAT revision.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up shared Docker arguments and record host information
        run: |
          mkdir -p "$RUNNER_TEMP/stat-ci"

          # Set up common docker arguments.
          docker_args=(
            --user 1000:1000
            --cap-add SYS_PTRACE
            --shm-size=256m
            --security-opt seccomp=unconfined
            --security-opt apparmor=unconfined
            -e HOME=/tmp
            -e ENROOT_DATA_PATH=/tmp/enroot/data
            -e ENROOT_CACHE_PATH=/tmp/enroot/cache
            -e ENROOT_RUNTIME_PATH=/tmp/enroot/run
          )
          docker_mounts=(-v "$PWD:/workspace:ro" -v "$RUNNER_TEMP/stat-ci:/results")

          # Both integration steps use this CPU-only selection: directly in Docker, then inside Enroot.
          # TODO: Optimize the list in order to keep execution time low. E.g. split between enroot and docker.
          integration_tests=(01 02 03 04 05 06 07 08 09 10 11)

          # Each subsequent Bash step loads these arrays automatically.
          declare -p docker_args docker_mounts integration_tests > "$RUNNER_TEMP/stat-ci/docker-env.sh"

          echo "BASH_ENV=$RUNNER_TEMP/stat-ci/docker-env.sh" >> "$GITHUB_ENV"

          git rev-parse HEAD | tee "$RUNNER_TEMP/stat-ci/source-commit.txt"
          {
            uname -a
            lscpu
          } | tee "$RUNNER_TEMP/stat-ci/host-info.log"
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: 1.1 Set up Pixi build environment
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tests/ci-image/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: JOBS=4
          target: pixi
          cache-from: type=gha,scope=dyninst-${{ matrix.arch }}

      - name: 1.2 Build Dyninst
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tests/ci-image/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: JOBS=4
          target: dyninst
          cache-from: type=gha,scope=dyninst-${{ matrix.arch }}
          # Save the expensive foundation even if later builds or tests fail.
          cache-to: type=gha,scope=dyninst-${{ matrix.arch }},mode=max,ignore-error=true

      - name: 1.3 Build Graphlib, MRNet, LaunchMON & Python tools
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tests/ci-image/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: JOBS=4
          target: libraries
          cache-from: |
            type=gha,scope=libraries-${{ matrix.arch }}
            type=gha,scope=dyninst-${{ matrix.arch }}
          cache-to: type=gha,scope=libraries-${{ matrix.arch }},mode=max,ignore-error=true

      - name: 1.4 Prepare MPI & Enroot
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tests/ci-image/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: JOBS=4
          target: runtime
          load: true
          tags: stat-ci:deps
          # Re-import external cache: earlier cache-only builds may leave layers remote.
          cache-from: |
            type=gha,scope=libraries-${{ matrix.arch }}
            type=gha,scope=dyninst-${{ matrix.arch }}

      - name: 2. Build STAT
        id: build-stat
        run: |
          # Mount the checkout read-only and install STAT into the shared results directory.
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            "${docker_mounts[@]}" \
            stat-ci:deps \
            bash /opt/stat-ci/build-stat.sh /workspace /results/stat-install \
            2>&1 | tee "$RUNNER_TEMP/stat-ci/build-stat.log"

      - name: Enable ptrace and Enroot user namespaces
        run: |
          # Allow Dyninst to attach to sibling processes on this disposable runner.
          sudo sysctl -w kernel.yama.ptrace_scope=0

          # Allow nested Enroot containers on this disposable GitHub runner.
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: 3.1 Validate installation
        id: installation
        if: ${{ !cancelled() && steps.build-stat.outcome == 'success' }}
        run: |
          # Allow the container user to write logs and sampled graphs.
          chmod a+w "$RUNNER_TEMP/stat-ci"

          docker run --rm \
            --platform "${{ matrix.platform }}" \
            "${docker_args[@]}" \
            "${docker_mounts[@]}" \
            stat-ci:deps \
            bash /opt/stat-ci/validate.sh /results/stat-install \
            2>&1 | tee "$RUNNER_TEMP/stat-ci/validation.log"

      - name: Test python unit tests
        id: units
        if: ${{ !cancelled() && steps.build-stat.outcome == 'success' }}
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            "${docker_args[@]}" \
            "${docker_mounts[@]}" \
            stat-ci:deps \
            bash /opt/stat-ci/unit-tests.sh /workspace /results/stat-install \
            2>&1 | tee "$RUNNER_TEMP/stat-ci/unit-tests.log"

      - name: 3.2 Test serial sampling
        id: serial
        if: ${{ !cancelled() && steps.build-stat.outcome == 'success' }}
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            "${docker_args[@]}" \
            "${docker_mounts[@]}" \
            stat-ci:deps \
            timeout --kill-after=10s 120 bash /opt/stat-ci/smoke-serial.sh \
              /workspace /results/stat-install /results/serial \
            2>&1 | tee "$RUNNER_TEMP/stat-ci/serial.log"

      - name: 3.3 Test MPI sampling
        id: mpi
        if: ${{ !cancelled() && steps.build-stat.outcome == 'success' }}
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            "${docker_args[@]}" \
            "${docker_mounts[@]}" \
            stat-ci:deps \
            timeout --kill-after=10s 150 bash /opt/stat-ci/smoke-mpi.sh \
              /workspace /results/stat-install /results/mpi plain \
            2>&1 | tee "$RUNNER_TEMP/stat-ci/mpi.log"

      - name: 3.4 Test MPI sampling inside Enroot
        id: enroot
        if: ${{ !cancelled() && steps.build-stat.outcome == 'success' }}
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            "${docker_args[@]}" \
            "${docker_mounts[@]}" \
            stat-ci:deps \
            timeout --kill-after=10s 150 bash /opt/stat-ci/smoke-mpi.sh \
              /workspace /results/stat-install /results/enroot enroot \
            2>&1 | tee "$RUNNER_TEMP/stat-ci/enroot.log"

      - name: 3.5 Integration tests on Host (via Docker)
        id: integration-docker
        if: ${{ !cancelled() && steps.build-stat.outcome == 'success' }}
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            "${docker_args[@]}" \
            "${docker_mounts[@]}" \
            stat-ci:deps \
            timeout --kill-after=10s 1200 bash /workspace/tests/integration/run-tests.sh "${integration_tests[@]}" \
            2>&1 | tee "$RUNNER_TEMP/stat-ci/integration-mpi.log"

      - name: 3.6 Integration tests in container (via Enroot)
        id: integration-enroot
        if: ${{ !cancelled() && steps.build-stat.outcome == 'success' }}
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            "${docker_args[@]}" \
            "${docker_mounts[@]}" \
            stat-ci:deps \
            timeout --kill-after=10s 1200 bash /workspace/tests/integration/run-tests.sh --enroot "${integration_tests[@]}" \
            2>&1 | tee "$RUNNER_TEMP/stat-ci/integration-enroot.log"

      - name: Summarize validation results
        if: ${{ !cancelled() && steps.build-stat.outcome == 'success' }}
        env:
          RESULT: ${{ job.status == 'success' && 'PASS' || 'FAIL' }}
        run: |
          cat <<'RESULTS' | tee "$RUNNER_TEMP/stat-ci/test-summary.log" >> "$GITHUB_STEP_SUMMARY"
          | Test | Result |
          | --- | --- |
          | Installation | ${{ steps.installation.outcome }} |
          | Python units | ${{ steps.units.outcome }} |
          | Serial | ${{ steps.serial.outcome }} |
          | MPI | ${{ steps.mpi.outcome }} |
          | MPI Enroot | ${{ steps.enroot.outcome }} |
          | Integration Docker | ${{ steps.integration-docker.outcome }} |
          | Integration Enroot | ${{ steps.integration-enroot.outcome }} |
          RESULTS
          echo "$RESULT: validation" | tee -a "$RUNNER_TEMP/stat-ci/test-summary.log" "$GITHUB_STEP_SUMMARY"
          test "$RESULT" = PASS

      - name: Make sampling artifacts readable
        if: always()
        run: |
          # STAT creates private directories as container UID 1000, which may differ from the runner UID.
          if [ -d "$RUNNER_TEMP/stat-ci" ]; then
            sudo chmod -R a+rX "$RUNNER_TEMP/stat-ci"
          fi

      - name: Save logs and sampling results
        # Preserve diagnostics even when a build or smoke test fails.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stat-ci-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/stat-ci/*.log
            ${{ runner.temp }}/stat-ci/source-commit.txt
            ${{ runner.temp }}/stat-ci/*/stat-cl.log
            ${{ runner.temp }}/stat-ci/*/stat_results/
            ${{ runner.temp }}/stat-ci/*/application.log
            ${{ runner.temp }}/stat-ci/integration/
